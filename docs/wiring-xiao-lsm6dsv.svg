<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1020" width="1100" height="1020" font-family="'Yu Gothic UI','Meiryo','Noto Sans JP','Segoe UI',sans-serif">
  <rect x="0" y="0" width="1100" height="1020" fill="#ffffff"/>

  <!-- header -->
  <text x="34" y="40" font-size="20" font-weight="bold" fill="#111">XIAO ESP32-S3 + LSM6DSV 実装配線図（実物のパッド位置・部品面から見た図）</text>
  <text x="34" y="62" font-size="12" fill="#444">両基板とも 2.54 mm ピッチ・7 ポジション。基板外形とパッド位置は実寸比（1 mm ≈ 10.2 px）。配線経路は一例で、交差部（⌒）は接続していない。</text>
  <text x="34" y="80" font-size="11.5" fill="#666">出典: Seeed 公式ピン図 front / back、BOOTH 商品写真のシルク（rev 5265159A-P1-241122、傾き補正して判読）、2026-08-03 のテスタ実測</text>

  <!-- ============ D0 battery-sense route (drawn first, behind) ============ -->
  <polyline points="560,220 470,220 470,150 1040,150 1040,860 872,860" fill="none" stroke="#b08900" stroke-width="2.2"/>

  <!-- ==================== LSM6DSV module (top view) ==================== -->
  <rect x="120" y="200" width="133" height="184" rx="6" fill="#23262b" stroke="#111" stroke-width="2"/>
  <text x="186" y="192" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">LSM6DSV モジュール（部品面）</text>
  <text x="186" y="400" font-size="9.5" text-anchor="middle" fill="#666">13 × 18 mm / 白猫屋 BOOTH</text>
  <text x="186" y="414" font-size="9" text-anchor="middle" fill="#a33">左列の上端 OSDO と下端 SDO の位置に右列パッドは無い</text>

  <!-- module pads: left column (7) -->
  <g fill="#d9c07a" stroke="#8a7027">
    <circle cx="132" cy="214" r="7"/>
    <circle cx="132" cy="240" r="7"/>
    <circle cx="132" cy="266" r="7"/>
    <circle cx="132" cy="292" r="7"/>
    <circle cx="132" cy="318" r="7"/>
    <circle cx="132" cy="344" r="7"/>
    <circle cx="132" cy="370" r="7"/>
  </g>
  <g font-size="9.5" fill="#fff">
    <text x="144" y="218">OSDO</text>
    <text x="144" y="244" font-weight="bold">3V3</text>
    <text x="144" y="270" font-weight="bold">GND</text>
    <text x="144" y="296" font-weight="bold">SCL</text>
    <text x="144" y="322" font-weight="bold">SDA</text>
    <text x="144" y="348">CS</text>
    <text x="144" y="374">SDO</text>
  </g>
  <!-- module pads: right column (5) -->
  <g fill="#d9c07a" stroke="#8a7027">
    <circle cx="241" cy="240" r="7"/>
    <circle cx="241" cy="266" r="7"/>
    <circle cx="241" cy="292" r="7"/>
    <circle cx="241" cy="318" r="7"/>
    <circle cx="241" cy="344" r="7"/>
  </g>
  <g font-size="9.5" fill="#fff" text-anchor="end">
    <text x="229" y="244">OCS</text>
    <text x="229" y="270">INT2</text>
    <text x="229" y="296" font-weight="bold">INT1</text>
    <text x="229" y="322">SCX</text>
    <text x="229" y="348">SDX</text>
  </g>

  <!-- ==================== XIAO ESP32-S3 (top view) ==================== -->
  <rect x="560" y="190" width="182" height="215" rx="8" fill="#23262b" stroke="#111" stroke-width="2"/>
  <rect x="622" y="174" width="58" height="16" rx="3" fill="#9aa0a6" stroke="#555"/>
  <text x="651" y="168" font-size="9.5" text-anchor="middle" fill="#555">USB-C（この端にアンテナ）</text>
  <text x="651" y="424" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">XIAO ESP32-S3（部品面）21 × 17.8 mm</text>
  <text x="651" y="396" font-size="9" text-anchor="middle" fill="#c9c9c9">BAT+ / BAT− は裏面パッド</text>

  <!-- XIAO pads left -->
  <g fill="#d9c07a" stroke="#8a7027">
    <rect x="552" y="213" width="16" height="14" rx="2"/>
    <rect x="552" y="239" width="16" height="14" rx="2"/>
    <rect x="552" y="265" width="16" height="14" rx="2"/>
    <rect x="552" y="291" width="16" height="14" rx="2"/>
    <rect x="552" y="317" width="16" height="14" rx="2"/>
    <rect x="552" y="343" width="16" height="14" rx="2"/>
    <rect x="552" y="369" width="16" height="14" rx="2"/>
  </g>
  <g font-size="9.5" fill="#fff">
    <text x="574" y="224" font-weight="bold">D0 / GPIO1</text>
    <text x="574" y="250">D1 / GPIO2</text>
    <text x="574" y="276">D2 / GPIO3</text>
    <text x="574" y="302" font-weight="bold">D3 / GPIO4</text>
    <text x="574" y="328" font-weight="bold">D4 / GPIO5</text>
    <text x="574" y="354" font-weight="bold">D5 / GPIO6</text>
    <text x="574" y="380">D6 / GPIO43</text>
  </g>
  <!-- XIAO pads right -->
  <g fill="#d9c07a" stroke="#8a7027">
    <rect x="734" y="213" width="16" height="14" rx="2"/>
    <rect x="734" y="239" width="16" height="14" rx="2"/>
    <rect x="734" y="265" width="16" height="14" rx="2"/>
    <rect x="734" y="291" width="16" height="14" rx="2"/>
    <rect x="734" y="317" width="16" height="14" rx="2"/>
    <rect x="734" y="343" width="16" height="14" rx="2"/>
    <rect x="734" y="369" width="16" height="14" rx="2"/>
  </g>
  <g font-size="9.5" fill="#fff" text-anchor="end">
    <text x="728" y="224">5V</text>
    <text x="728" y="250" font-weight="bold">GND</text>
    <text x="728" y="276" font-weight="bold">3V3</text>
    <text x="728" y="302">D10 / GPIO9</text>
    <text x="728" y="328">D9 / GPIO8</text>
    <text x="728" y="354" font-weight="bold">D8 / GPIO7</text>
    <text x="728" y="380">D7 / GPIO44</text>
  </g>

  <!-- ==================== wires ==================== -->
  <!-- 3V3: module left col row2 -> XIAO right col row3 -->
  <polyline points="132,240 60,240 60,470 800,470 800,272 750,272" fill="none" stroke="#c62828" stroke-width="2.4"/>
  <text x="64" y="462" font-size="10" font-weight="bold" fill="#c62828">3V3</text>
  <!-- GND -->
  <polyline points="132,266 76,266 76,490 820,490 820,246 750,246" fill="none" stroke="#222" stroke-width="2.4"/>
  <text x="80" y="482" font-size="10" font-weight="bold" fill="#222">GND</text>
  <!-- SDA: module row5 -> D4 -->
  <polyline points="132,318 92,318 92,510 500,510 500,324 552,324" fill="none" stroke="#2e7d32" stroke-width="2.4"/>
  <text x="96" y="502" font-size="10" font-weight="bold" fill="#2e7d32">SDA</text>
  <!-- SCL: module row4 -> D5 -->
  <polyline points="132,292 108,292 108,530 520,530 520,350 552,350" fill="none" stroke="#1565c0" stroke-width="2.4"/>
  <text x="112" y="522" font-size="10" font-weight="bold" fill="#1565c0">SCL</text>
  <!-- INT1 (optional now) -->
  <polyline points="241,292 460,292 460,298 552,298" fill="none" stroke="#8e24aa" stroke-width="2.2" stroke-dasharray="7 4"/>
  <text x="300" y="286" font-size="9.5" font-weight="bold" fill="#8e24aa">INT1（今は未使用・将来用に今引く）</text>

  <!-- crossing hops on the D8 wire -->
  <polyline points="750,350 792,350" fill="none" stroke="#ef6c00" stroke-width="2.4"/>
  <path d="M792,350 a8,8 0 0 1 16,0" fill="none" stroke="#ef6c00" stroke-width="2.4"/>
  <polyline points="808,350 812,350" fill="none" stroke="#ef6c00" stroke-width="2.4"/>
  <path d="M812,350 a8,8 0 0 1 16,0" fill="none" stroke="#ef6c00" stroke-width="2.4"/>
  <polyline points="828,350 900,350" fill="none" stroke="#ef6c00" stroke-width="2.4"/>
  <circle cx="900" cy="350" r="3.6" fill="#ef6c00"/>
  <text x="836" y="342" font-size="9.5" font-weight="bold" fill="#ef6c00">押下で Low</text>

  <!-- pull-up 10k to 3V3 -->
  <polyline points="900,350 900,306" fill="none" stroke="#c62828" stroke-width="2.4"/>
  <rect x="888" y="256" width="24" height="50" fill="#fff" stroke="#c62828" stroke-width="2.2"/>
  <text x="920" y="278" font-size="10.5" font-weight="bold" fill="#c62828">10 kΩ</text>
  <text x="920" y="292" font-size="9" fill="#c62828">GPIO7 の近くに置く</text>
  <polyline points="900,256 900,232" fill="none" stroke="#c62828" stroke-width="2.4"/>
  <polyline points="884,232 916,232" stroke="#c62828" stroke-width="3"/>
  <text x="900" y="223" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#c62828">3V3</text>

  <!-- button to GND -->
  <polyline points="900,350 900,406" fill="none" stroke="#222" stroke-width="2.4"/>
  <polyline points="886,406 914,406" stroke="#222" stroke-width="2.6"/>
  <polyline points="890,440 926,424" stroke="#222" stroke-width="2.6"/>
  <polyline points="900,440 900,470" fill="none" stroke="#222" stroke-width="2.4"/>
  <polyline points="886,440 914,440" stroke="#222" stroke-width="2.6"/>
  <text x="936" y="412" font-size="10.5" font-weight="bold" fill="#111">モーメンタリ</text>
  <text x="936" y="426" font-size="10.5" font-weight="bold" fill="#111">ボタン（NO）</text>
  <polyline points="884,470 916,470" stroke="#222" stroke-width="3"/>
  <polyline points="891,478 909,478" stroke="#222" stroke-width="3"/>
  <polyline points="897,486 903,486" stroke="#222" stroke-width="3"/>
  <text x="900" y="504" font-size="10" font-weight="bold" text-anchor="middle" fill="#222">GND</text>

  <!-- D0 sense label -->
  <text x="474" y="144" font-size="9.5" font-weight="bold" fill="#b08900">電池電圧監視（D0 / GPIO1 → 下の分圧へ）</text>

  <!-- ==================== battery + monitor panel ==================== -->
  <rect x="620" y="620" width="440" height="380" rx="8" fill="#fffdf5" stroke="#b08900" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="640" y="646" font-size="12" font-weight="bold" fill="#7a5c00">電池と電圧監視（第11・12章）</text>

  <rect x="650" y="670" width="90" height="80" rx="4" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <text x="695" y="702" font-size="9.5" text-anchor="middle" fill="#111">保護回路付き</text>
  <text x="695" y="717" font-size="9.5" text-anchor="middle" fill="#111">1セル Li-ion</text>
  <text x="748" y="694" font-size="12" font-weight="bold" fill="#c62828">＋</text>
  <text x="748" y="739" font-size="12" font-weight="bold" fill="#222">−</text>

  <polyline points="740,690 770,690" stroke="#c62828" stroke-width="2.4" fill="none"/>
  <rect x="770" y="674" width="58" height="32" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="799" y="694" font-size="8.5" text-anchor="middle" fill="#666">SW（任意）</text>
  <polyline points="828,690 880,690" stroke="#c62828" stroke-width="2.4" fill="none"/>
  <circle cx="860" cy="690" r="3.4" fill="#c62828"/>
  <text x="886" y="694" font-size="10.5" font-weight="bold" fill="#c62828">BAT+（裏面）</text>
  <text x="770" y="666" font-size="8" fill="#666">入れるかは未確定</text>

  <polyline points="740,735 880,735" stroke="#222" stroke-width="2.4" fill="none"/>
  <text x="886" y="739" font-size="10.5" font-weight="bold" fill="#222">BAT−（裏面）</text>

  <polyline points="860,690 860,780" stroke="#b08900" stroke-width="2.2" fill="none"/>
  <rect x="848" y="780" width="24" height="50" fill="#fff" stroke="#b08900" stroke-width="2.2"/>
  <text x="880" y="810" font-size="10" font-weight="bold" fill="#b08900">R2 100 kΩ</text>
  <polyline points="860,830 860,872" stroke="#b08900" stroke-width="2.2" fill="none"/>
  <circle cx="860" cy="860" r="3.4" fill="#b08900"/>
  <rect x="848" y="872" width="24" height="50" fill="#fff" stroke="#b08900" stroke-width="2.2"/>
  <text x="880" y="902" font-size="10" font-weight="bold" fill="#b08900">R1 100 kΩ</text>
  <polyline points="860,922 860,950" stroke="#222" stroke-width="2.2" fill="none"/>
  <polyline points="846,950 874,950" stroke="#222" stroke-width="3"/>
  <polyline points="852,957 868,957" stroke="#222" stroke-width="3"/>
  <polyline points="857,964 863,964" stroke="#222" stroke-width="3"/>

  <polyline points="860,860 790,860 790,884" stroke="#b08900" stroke-width="2.2" fill="none"/>
  <polyline points="776,884 804,884" stroke="#222" stroke-width="3"/>
  <polyline points="776,894 804,894" stroke="#222" stroke-width="3"/>
  <polyline points="790,894 790,920" stroke="#222" stroke-width="2.2" fill="none"/>
  <polyline points="776,920 804,920" stroke="#222" stroke-width="3"/>
  <polyline points="782,927 798,927" stroke="#222" stroke-width="3"/>
  <polyline points="787,934 793,934" stroke="#222" stroke-width="3"/>
  <text x="712" y="892" font-size="10" font-weight="bold" fill="#111">100 nF</text>

  <text x="640" y="984" font-size="9" fill="#a33">極性はテスタで実測してから接続。ボタンを電池と直列に入れない。BAT+ / BAT− は XIAO 裏面。</text>

  <!-- ==================== notes ==================== -->
  <rect x="34" y="620" width="566" height="380" rx="8" fill="#f8f9fb" stroke="#bbb"/>
  <text x="52" y="644" font-size="12" font-weight="bold" fill="#111">実装メモ</text>
  <g font-size="10.5" fill="#222">
    <text x="52" y="668">・IMU へ配線するのは 3V3 / GND / SDA / SCL の 4 本と、任意の INT1 だけ。</text>
    <text x="64" y="684">SDA / SCL / SDO / CS は基板に 4.7 kΩ プルアップ実装済み（実測 4.6 kΩ）。</text>
    <text x="52" y="706">・SDO は基板プルアップで High、アドレスは 0x6B。SDO / CS の配線は不要。</text>
    <text x="64" y="722" fill="#a33">表面の SDO ジャンパは GND 側（0x6A 選択用）。橋絡しないこと。</text>
    <text x="52" y="744">・INT1 は現行ファームでは未使用。後から引くのが最も面倒なので今引いておく。</text>
    <text x="52" y="766">・3V3 と GND は XIAO の右列、SDA / SCL は左列。反対側の辺どうしをつなぐため、</text>
    <text x="64" y="782">配線は必ず基板の周囲を回り込む。図の交差（⌒）は接続していない。</text>
    <text x="52" y="804">・電圧監視は配線だけ先に済ませ、有効化はファーム設定のみで行う。</text>
    <text x="64" y="820">BAT_EXTERNAL / r1=100, r2=100, shieldR=0（倍率 2.0、4.2 V で ADC 2.1 V）。</text>
    <text x="64" y="836">100 kΩ×2 は常時約 21 µA。220 kΩ×2（r1=r2=220）なら約 9.5 µA。</text>
    <text x="52" y="858">・5V (VBUS) には何も繋がない。外付け I2C プルアップも不要。</text>
    <text x="52" y="880">・内蔵 LED は GPIO21、アクティブ Low。GPIO0 / 3 / 45 / 46 はストラッピング。</text>
    <text x="52" y="902">・取付は部品面を体の外側、USB を足側に向ける（この向きで DEG_0 を実機確認）。</text>
    <text x="64" y="918" fill="#a33">IMU をこの図と違う角度で固定すると IMU_ROTATION の再確認が必要。</text>
    <text x="52" y="940">・IMU と XIAO は隣接させ、SDA / SCL の配線長は 10 cm 以下。</text>
    <text x="52" y="962">・USB コネクタ側の端はアンテナ。その付近に配線や電池を重ねない。</text>
    <text x="52" y="984">・同じ名前の 3V3 / GND 記号どうしは接続されている。</text>
  </g>
</svg>
